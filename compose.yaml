name: smart-budget

services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-smart_budget_db}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-local-only}
      POSTGRES_USER: ${DB_USERNAME:-smart_budget}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-admin-local-only}
      KC_HEALTH_ENABLED: "true"
      DEMO_OWNER_ONE_PASSWORD: ${DEMO_OWNER_ONE_PASSWORD:-change-me-owner-one}
      DEMO_OWNER_TWO_PASSWORD: ${DEMO_OWNER_TWO_PASSWORD:-change-me-owner-two}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak/smart-budget-realm.json:/opt/keycloak/data/import/smart-budget-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "200 OK" <&3'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  application:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-smart_budget_db}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-local-only}
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-smart_budget}
      SERVER_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  keycloak-data:
  postgres-data:
