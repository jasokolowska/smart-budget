name: Java CI with Gradle

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('server/**/gradle-wrapper.properties', 'server/**.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Ensure server/gradlew is executable (if present)
        run: |
          if [ -f server/gradlew ]; then chmod +x server/gradlew; else echo "server/gradlew not found, will attempt to run gradle from PATH"; fi

      - name: Build with Gradle Wrapper (server)
        working-directory: server
        run: ./gradlew build --no-daemon --stacktrace

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate and submit dependency graph (server)
        working-directory: server
        # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
        # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
        uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582